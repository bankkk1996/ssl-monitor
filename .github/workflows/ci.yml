name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@9 "public/**/*.html"
      - name: Check JavaScript syntax
        run: node --check public/app.js && node --check checker/check.mjs
      - name: Dry-run deploy
        run: npx --yes wrangler@4.147.0 deploy --dry-run

  deploy:
    name: Deploy (production)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ssl.sorawich.in.th
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when no Cloudflare token is configured
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not set - skipping deploy (deploy locally with npx wrangler deploy)."
      - uses: actions/checkout@v5
      - name: Deploy to Cloudflare Workers
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: deploy --message "${{ github.sha }}"
