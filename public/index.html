<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SSL Monitor — Sorawich</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23111'/><text x='50' y='68' font-size='54' text-anchor='middle'>🔒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>🔒 SSL Monitor</h1>
    <button type="button" class="btn small" id="reload">รีเฟรช</button>
  </header>

  <main>
    <div id="alert" class="alert" hidden></div>
    <div id="health" class="alert warn" hidden></div>

    <section class="stats" aria-label="สรุป">
      <div class="stat"><span class="label">ทั้งหมด</span><span class="value" id="sTotal">–</span></div>
      <div class="stat"><span class="label">เข้าไม่ได้</span><span class="value" id="sDown">–</span></div>
      <div class="stat"><span class="label">SSL มีปัญหา / ≤ 14 วัน</span><span class="value" id="sSsl">–</span></div>
      <div class="stat"><span class="label">โดเมน ≤ 60 วัน</span><span class="value" id="sDomain">–</span></div>
    </section>

    <section class="card">
      <form id="addForm" class="add" autocomplete="off">
        <input name="domain" type="text" inputmode="url" required placeholder="example.com" aria-label="โดเมน">
        <select name="priority" aria-label="ความสำคัญ">
          <option value="High">สำคัญมาก</option>
          <option value="Normal" selected>ปกติ</option>
          <option value="Low">ต่ำ</option>
        </select>
        <button type="submit" class="btn primary" id="addBtn">เพิ่ม</button>
      </form>
      <p class="hint">เพิ่มแล้วระบบจะเช็กว่าเว็บเปิดได้และวันหมดอายุโดเมนทันที ส่วนใบรับรอง SSL เช็กทุก 30 นาที</p>
    </section>

    <section class="card">
      <div id="list" class="list"><p class="empty">กำลังโหลด…</p></div>
    </section>
  </main>

  <footer id="who"></footer>
  <script src="app.js"></script>
</body>
</html>
